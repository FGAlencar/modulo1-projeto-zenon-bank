services:
  postgresql:
    image: postgres:18-alpine
    container_name: postgresql-zenon
    environment:
      POSTGRES_DB: java_elite
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
volumes:
  pgdata:
    name: postgresql_volume